name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: vicious-vix-assistant/Vicious-vix-assistant--main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: vicious-vix-assistant/Vicious-vix-assistant--main/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: vicious-vix-assistant/Vicious-vix-assistant--main/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vicious-assistant-debug-apk
          path: vicious-vix-assistant/Vicious-vix-assistant--main/android/app/build/outputs/apk/debug/app-debug.apk
